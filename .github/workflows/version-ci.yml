# Version CI: runs only for major and minor versions. It runs when a tag
# vX.Y.0 is pushed, and on manual dispatch. Patch versions (vX.Y.Z, Z > 0) and
# ordinary pushes run nothing: day-to-day testing happens locally, on macOS,
# before each commit (tools/check.sh). Details: docs/development/ci.md
#
# Fail fast: the jobs run as a chain
#   checks -> macOS tests -> Linux tests -> Windows tests -> macOS release build
# Any failure stops everything after it, and a failing matrix leg cancels its
# siblings.
#
# A tag push runs every job. A manual dispatch can pick which ones run (all are
# on by default); a job that is switched off is skipped and the chain carries
# on past it. For example, Linux only:
#   gh workflow run version-ci.yml -f macos=false -f windows=false -f release=false
#
# No job publishes anything: no artifacts, releases, or packages. Compiled
# builds are never downloadable from GitHub (tools/check-no-published-builds.sh).

name: Version CI

on:
  push:
    tags: ['v[0-9]+.[0-9]+.0']
  workflow_dispatch:
    inputs:
      macos:
        description: macOS tests (Apple Clang)
        type: boolean
        default: true
      linux:
        description: Linux tests (GCC 12)
        type: boolean
        default: true
      windows:
        description: Windows tests (MSVC)
        type: boolean
        default: true
      asan:
        description: Include the ASan/UBSan legs (macOS and Linux)
        type: boolean
        default: true
      release:
        description: macOS release build (universal, real identity)
        type: boolean
        default: true

concurrency:
  group: version-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Version, format, and identity checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the leak check reads every commit message
      - name: Tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -nE 's/^[[:space:]]*VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(VERSION $version) in CMakeLists.txt"
            exit 1
          fi
      - run: pip install clang-format==23.1.5
      - run: tools/format.sh --check
      - name: Identity leak check
        env:
          BRUTALIS_MANUFACTURER_CODE: ${{ secrets.BRUTALIS_MANUFACTURER_CODE }}
          BRUTALIS_PLUGIN_CODE: ${{ secrets.BRUTALIS_PLUGIN_CODE }}
          BRUTALIS_BUNDLE_ID: ${{ secrets.BRUTALIS_BUNDLE_ID }}
        run: tools/check-identity-leak.sh
      - run: tools/check-no-published-builds.sh

  # The presets for the macOS and Linux matrices: debug and asan, or debug
  # only when a dispatch switches asan off. The two builds share no object
  # files (the sanitizer flags change every one), so they run side by side.
  # Inputs are empty on a tag push, so the event check comes first.
  # The names hold no matrix expression: GitHub appends " (<preset>)" to each
  # leg by itself, and a job skipped by its if: is never expanded, so an
  # expression in the name would show up literally.
  macos:
    name: macOS tests
    needs: checks
    if: github.event_name != 'workflow_dispatch' || inputs.macos
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        preset: ${{ fromJSON((github.event_name == 'workflow_dispatch' && !inputs.asan) && '["debug"]' || '["debug", "asan"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: brew install ninja
      - run: cmake --workflow --preset ${{ matrix.preset }}
      - name: clang-tidy
        if: matrix.preset == 'debug'
        run: |
          pip install clang-tidy==23.1.4
          CLANG_TIDY="$(python3 -c 'import shutil; print(shutil.which("clang-tidy"))')" tools/tidy.sh build/debug

  # From here on, each job runs if it is selected and nothing before it failed
  # or was cancelled. A skipped job (switched off) does not stop the chain;
  # failure() also sees failures further back, through a skipped job.
  #
  # Linux: Ubuntu 22.04 with its own GCC 12 is the minimum supported Linux
  # (decision D8). xvfb is there because the editor test creates JUCE
  # components. Two legs, because each checks something the other can't:
  # debug runs pluginval on the GCC-built VST3 (an ASan plugin can't be loaded),
  # and asan runs the tests under GCC's sanitizers with libstdc++, including
  # LeakSanitizer, which Apple Clang does not support on macOS.
  linux:
    name: Linux GCC 12 tests
    needs: macos
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.linux) }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        preset: ${{ fromJSON((github.event_name == 'workflow_dispatch' && !inputs.asan) && '["debug"]' || '["debug", "asan"]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libegl-dev libglu1-mesa-dev mesa-common-dev
      - name: Configure, build, and test
        env:
          CC: gcc-12
          CXX: g++-12
        run: xvfb-run -a cmake --workflow --preset ${{ matrix.preset }}

  # Windows: Ninja needs cl.exe on PATH, so everything runs inside the Visual
  # Studio developer environment (vcvars64.bat), which also provides Ninja.
  # Debug only: the asan preset is not available on Windows.
  windows:
    name: Windows MSVC tests (debug)
    needs: linux
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.windows) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure, build, and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake --workflow --preset debug

  release:
    name: macOS release build (universal)
    needs: windows
    if: ${{ !cancelled() && !failure() && (github.event_name != 'workflow_dispatch' || inputs.release) }}
    runs-on: macos-latest
    env:
      BRUTALIS_MANUFACTURER_CODE: ${{ secrets.BRUTALIS_MANUFACTURER_CODE }}
      BRUTALIS_PLUGIN_CODE: ${{ secrets.BRUTALIS_PLUGIN_CODE }}
      BRUTALIS_BUNDLE_ID: ${{ secrets.BRUTALIS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: brew install ninja
      # The release preset sets BRUTALIS_REQUIRE_REAL_IDENTITY=ON, so a missing
      # secret fails configure instead of producing a placeholder build.
      - name: Configure, build, and test
        run: |
          cmake --preset release \
            -DBRUTALIS_MANUFACTURER_CODE="$BRUTALIS_MANUFACTURER_CODE" \
            -DBRUTALIS_PLUGIN_CODE="$BRUTALIS_PLUGIN_CODE" \
            -DBRUTALIS_BUNDLE_ID="$BRUTALIS_BUNDLE_ID"
          cmake --build --preset release
          ctest --preset release
      # Deliberately no upload step. GitHub hosts source only: the release
      # build is compiled and validated here, then discarded with the runner.
      # tools/check-no-published-builds.sh (job 1) fails on any publishing step.
