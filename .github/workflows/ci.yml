# Continuous integration: every push and pull request.
# Builds and tests on macOS (Apple Clang), checks formatting and clang-tidy,
# and checks that no private identity value has entered the repository.
# Linux and Windows jobs are deferred to a later phase (PLAN.md); draft jobs
# for both are in commit 2b5476c. Ordinary CI builds use the
# placeholder identity. Details: docs/development/ci.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install clang-format==23.1.5
      - run: tools/format.sh --check

  identity-leak:
    name: Identity leak check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # commit messages are checked too
      - name: Check tracked files and commit messages
        env:
          BRUTALIS_MANUFACTURER_CODE: ${{ secrets.BRUTALIS_MANUFACTURER_CODE }}
          BRUTALIS_PLUGIN_CODE: ${{ secrets.BRUTALIS_PLUGIN_CODE }}
          BRUTALIS_BUNDLE_ID: ${{ secrets.BRUTALIS_BUNDLE_ID }}
        run: tools/check-identity-leak.sh

  macos:
    name: macOS (Apple Clang, ${{ matrix.preset }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - run: brew install ninja
      - run: cmake --workflow --preset ${{ matrix.preset }}
      - name: clang-tidy
        if: matrix.preset == 'debug'
        run: |
          pip install clang-tidy==23.1.4
          CLANG_TIDY="$(python3 -c 'import shutil; print(shutil.which("clang-tidy"))')" tools/tidy.sh build/debug
